name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      nonrust: ${{ steps.filter.outputs.nonrust == 'true' || steps.filter.outputs.dependencies == 'true' || steps.filter.outputs.cli_inputs == 'true' }}
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.cli_inputs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            nonrust:
              - '**'
              - '!crates/**'
              - '!Cargo.toml'
              - '!Cargo.lock'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!**/*.txt'
              - '!**/LICENSE'
              - '!LICENSE'
            dependencies:
              - '**/requirements*.txt'
              - 'sdk/packages/python/README.md'
              - 'sdk/packages/langchain/README.md'
            cli_inputs:
              - 'cli/README.md'
              - 'cli/LICENSE'
            rust:
              - '**'
              - '!**/*.md'
              - '!**/*.mdx'
              - '!**/*.txt'
              - '!**/LICENSE'
              - '!LICENSE'
              - '!**/*.ts'
              - '!**/*.tsx'

  lint:
    name: Lint and format
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - if: needs.changes.outputs.nonrust == 'true'
        run: bun run check
      - if: needs.changes.outputs.nonrust != 'true'
        run: |
          bun scripts/check-text.ts
          bun scripts/check-version-bump.ts
          git ls-files -z -- '*.md' '*.mdx' | xargs -0 -r bun x oxfmt --check

  sdk-typescript:
    needs: changes
    if: needs.changes.outputs.nonrust == 'true'
    name: SDK TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run type-check
      - run: bun run build:ts
      - run: bun run generate:check
      - run: bun run test:ts

  ai-sdk:
    needs: changes
    if: needs.changes.outputs.nonrust == 'true'
    name: AI SDK tools
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/packages/ai-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
        working-directory: sdk/packages/typescript
      - run: bun run check-types
      - run: bun run test
      - run: bun run build

  sdk-python:
    needs: changes
    if: needs.changes.outputs.nonrust == 'true'
    name: SDK Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --project packages/python --dev
      - run: uv run --project packages/python ruff check packages/python/src test/python && uv run --project packages/python ruff format --check packages/python/src test/python
      - run: uv run --directory packages/python pyright
      - run: uv build --project packages/python
      - run: |
          uv run --project packages/python python scripts/gen_python.py
          uv run --project packages/python ruff format packages/python/src/stophy/generated
          git diff --exit-code -- packages/python/src/stophy/generated
      - run: uv --project packages/python run pytest

  langchain:
    needs: changes
    if: needs.changes.outputs.nonrust == 'true'
    name: LangChain tools
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/packages/langchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests && uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest
      - run: uv build

  dify:
    needs: changes
    if: needs.changes.outputs.nonrust == 'true'
    name: Dify plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Rust SDK, CLI and MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all --check
      - run: python3 crates/stophy/generate.py --check
      - run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo +stable test --locked --workspace

  cli-binary:
    name: CLI binary (${{ matrix.platform }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      NATIVE_TARGET: ${{ matrix.target }}
      NATIVE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Rust target and cargo-dist
        shell: bash
        run: |
          rustup default stable
          rustup target add "$NATIVE_TARGET"
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) dist_target=x86_64-unknown-linux-gnu ;;
            Linux/ARM64) dist_target=aarch64-unknown-linux-gnu ;;
            macOS/X64) dist_target=x86_64-apple-darwin ;;
            macOS/ARM64) dist_target=aarch64-apple-darwin ;;
            Windows/X64) dist_target=x86_64-pc-windows-msvc ;;
          esac
          url="https://github.com/axodotdev/cargo-dist/releases/download/v0.34.0/cargo-dist-$dist_target"
          if [[ "$RUNNER_OS" == Windows ]]; then
            curl --fail --silent --show-error --location "$url.zip" -o "$RUNNER_TEMP/dist.zip"
            unzip -j "$RUNNER_TEMP/dist.zip" dist.exe -d "$RUNNER_TEMP"
          else
            curl --fail --silent --show-error --location "$url.tar.xz" | tar -xJ -C "$RUNNER_TEMP" --strip-components=1 "cargo-dist-$dist_target/dist"
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then sudo apt-get update -qq && sudo apt-get install -y musl-tools; fi
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build Stophy
        shell: bash
        run: dist build --artifacts=local --target "$NATIVE_TARGET"
      - name: Test native executable and npm entry points
        shell: bash
        run: |
          exe="target/$NATIVE_TARGET/dist/stophy"
          if [[ "$RUNNER_OS" == Windows ]]; then exe+=.exe; fi
          "$exe" --version
          python cli/scripts/stage-native.py "$NATIVE_PLATFORM" "$exe"
          out="$PWD/target/native/$NATIVE_PLATFORM"
          npm pack ./cli --pack-destination "$out"
          npm install --prefix "$RUNNER_TEMP/stophy-npm" --offline --no-audit --no-fund "$out"/*.tgz
          bin="$RUNNER_TEMP/stophy-npm/node_modules/.bin"
          if [[ "$RUNNER_OS" == Windows ]]; then
            "$bin/stophy.cmd" --version
            "$bin/stophy.cmd" mcp --help
          else
            "$bin/stophy" --version
            "$bin/stophy" mcp --help
          fi
      - name: Test macOS and Linux installer
        if: matrix.platform == 'linux-x64'
        run: bash cli/tests/install.sh
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./sdk/test/typescript/windows-installer.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.platform }}
          path: target/native/${{ matrix.platform }}/
          if-no-files-found: error

  cli-packages:
    name: CLI archives and packages
    needs: cli-binary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: target/native
      - name: Build Linux packages and fill formula checksums
        run: |
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            mv "target/native/native-$platform" "target/native/$platform"
            if [[ "$platform" != win32-* ]]; then chmod +x "target/native/$platform/stophy-$platform"; fi
          done
          curl --fail --silent --show-error --location https://github.com/goreleaser/nfpm/releases/download/v2.45.1/nfpm_2.45.1_Linux_x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP" nfpm
          PATH="$RUNNER_TEMP:$PATH" bash cli/scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-packages
          path: |
            target/native/*.deb
            target/native/*.rpm
            target/native/*.apk
            target/native/*.pkg.tar.zst
            target/native/checksums.txt
            target/native/stophy.rb
          if-no-files-found: error
