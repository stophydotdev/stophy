name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sdk/packages/typescript/package.json
      - sdk/packages/python/pyproject.toml
      - sdk/packages/ai-sdk/package.json

permissions:
  contents: read
  id-token: write

jobs:
  sdk-npm:
    name: SDK on npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
        working-directory: .
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "stophy@${VERSION}" version > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists == 'false'
        run: npm publish --access public --tag latest

  ai-sdk-npm:
    name: AI SDK tools on npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/packages/ai-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
        working-directory: sdk/packages/typescript
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@stophy/ai-sdk@${VERSION}" version > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qx "## ${VERSION}" CHANGELOG.md 2>/dev/null; then echo "released=true" >> "$GITHUB_OUTPUT"; else echo "released=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists == 'false' && steps.version.outputs.released == 'true'
        run: npm publish --access public --tag latest

  sdk-python:
    name: SDK on PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: version
        run: |
          VERSION=$(uv version --project packages/python --short)
          STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://pypi.org/pypi/stophy/${VERSION}/json")
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI version check failed with HTTP $STATUS" >&2; exit 1 ;;
          esac
      - if: steps.version.outputs.exists == 'false'
        run: uv build --project packages/python
      - if: steps.version.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/packages/python/dist/
