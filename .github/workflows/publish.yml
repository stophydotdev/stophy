name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sdk/packages/typescript/package.json
      - sdk/packages/python/pyproject.toml
      - sdk/packages/ai-sdk/package.json

permissions:
  contents: read

jobs:
  build-sdk-npm:
    name: Build the SDK for npm
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: sdk/packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
        working-directory: .
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "stophy@${VERSION}" version > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists == 'false'
        run: bun run generate && bun run build
      - id: pack
        if: steps.version.outputs.exists == 'false'
        run: |
          mkdir "$RUNNER_TEMP/pack"
          FILE=$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/pack")
          SHA=$(sha256sum "$RUNNER_TEMP/pack/$FILE" | cut -d' ' -f1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  $FILE" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.version.outputs.exists == 'false'
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/pack/$FILE"
          node --input-type=module -e 'const sdk = await import("stophy"); if (Object.keys(sdk).length === 0) process.exit(1)'
          node -e 'if (Object.keys(require("stophy")).length === 0) process.exit(1)'
      - if: steps.version.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-npm
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error

  publish-sdk-npm:
    name: Publish the SDK to npm
    needs: build-sdk-npm
    if: needs.build-sdk-npm.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-npm
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - env:
          FILE: ${{ needs.build-sdk-npm.outputs.file }}
          SHA: ${{ needs.build-sdk-npm.outputs.sha256 }}
        run: |
          echo "$SHA  pack/$FILE" | sha256sum --check --strict
          npm publish "./pack/$FILE" --access public --tag latest --ignore-scripts

  build-ai-sdk-npm:
    name: Build the AI SDK tools for npm
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      released: ${{ steps.version.outputs.released }}
      file: ${{ steps.pack.outputs.file }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: sdk/packages/ai-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run build
        working-directory: sdk/packages/typescript
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@stophy/ai-sdk@${VERSION}" version > /dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          if grep -qx "## ${VERSION}" CHANGELOG.md 2>/dev/null; then echo "released=true" >> "$GITHUB_OUTPUT"; else echo "released=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists == 'false' && steps.version.outputs.released == 'true'
        run: bun run build
      - id: pack
        if: steps.version.outputs.exists == 'false' && steps.version.outputs.released == 'true'
        run: |
          mkdir "$RUNNER_TEMP/pack" "$RUNNER_TEMP/deps"
          FILE=$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/pack")
          SHA=$(sha256sum "$RUNNER_TEMP/pack/$FILE" | cut -d' ' -f1)
          npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP/deps" ../typescript > /dev/null
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  $FILE" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.version.outputs.exists == 'false' && steps.version.outputs.released == 'true'
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund ai zod "$RUNNER_TEMP"/deps/*.tgz "$RUNNER_TEMP/pack/$FILE"
          node --input-type=module -e 'const sdk = await import("@stophy/ai-sdk"); if (Object.keys(sdk).length === 0) process.exit(1)'
          node -e 'if (Object.keys(require("@stophy/ai-sdk")).length === 0) process.exit(1)'
      - if: steps.version.outputs.exists == 'false' && steps.version.outputs.released == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ai-sdk-npm
          path: ${{ runner.temp }}/pack/
          if-no-files-found: error

  publish-ai-sdk-npm:
    name: Publish the AI SDK tools to npm
    needs: build-ai-sdk-npm
    if: needs.build-ai-sdk-npm.outputs.exists == 'false' && needs.build-ai-sdk-npm.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ai-sdk-npm
          path: pack
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - env:
          FILE: ${{ needs.build-ai-sdk-npm.outputs.file }}
          SHA: ${{ needs.build-ai-sdk-npm.outputs.sha256 }}
        run: |
          echo "$SHA  pack/$FILE" | sha256sum --check --strict
          npm publish "./pack/$FILE" --access public --tag latest --ignore-scripts

  build-sdk-python:
    name: Build the SDK for PyPI
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.version.outputs.exists }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: version
        run: |
          VERSION=$(uv version --project packages/python --short)
          STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "https://pypi.org/pypi/stophy/${VERSION}/json")
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI version check failed with HTTP $STATUS" >&2; exit 1 ;;
          esac
      - if: steps.version.outputs.exists == 'false'
        run: uv build --project packages/python
      - id: pack
        if: steps.version.outputs.exists == 'false'
        working-directory: sdk/packages/python/dist
        run: |
          sha256sum ./* | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha256=$(sha256sum ./* | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.exists == 'false'
        run: |
          for dist in packages/python/dist/*.whl packages/python/dist/*.tar.gz; do
            uv run --isolated --no-project --with "$dist" python -c "import stophy"
          done
      - if: steps.version.outputs.exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-python
          path: sdk/packages/python/dist/
          if-no-files-found: error

  publish-sdk-python:
    name: Publish the SDK to PyPI
    needs: build-sdk-python
    if: needs.build-sdk-python.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sdk-python
          path: dist
      - env:
          SHA: ${{ needs.build-sdk-python.outputs.sha256 }}
        run: |
          cd dist
          [ "$(sha256sum ./* | sha256sum | cut -d' ' -f1)" = "$SHA" ]
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
