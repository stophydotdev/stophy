name: PyPI

on:
  push:
    tags:
      - "langchain-stophy-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langchain-stophy:
    name: langchain-stophy on PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/packages/langchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: github.ref_type == 'tag'
        run: |
          VERSION=$(uv version --short)
          if [ "${GITHUB_REF_NAME}" != "langchain-stophy-v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${VERSION}" >&2
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/packages/langchain/dist/
