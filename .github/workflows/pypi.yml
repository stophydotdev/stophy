name: PyPI

on:
  push:
    tags:
      - "langchain-stophy-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langchain-stophy:
    name: langchain-stophy on PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk/packages/langchain
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - if: github.ref_type == 'tag'
        run: |
          VERSION=$(uv version --short)
          if [ "${GITHUB_REF_NAME}" != "langchain-stophy-v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${VERSION}" >&2
            exit 1
          fi
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/packages/langchain/dist/
