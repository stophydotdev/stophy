identity:
  name: web_search
  author: stophy
  label:
    en_US: Web Search
description:
  human:
    en_US: Search the web and get ranked pages with title, URL and description.
  llm: Search the web. Returns ranked pages with title, url and description. Use read_page to get the full text of one.
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: Query
    human_description:
      en_US: What to search for.
    llm_description: What to search for.
    form: llm
  - name: limit
    type: number
    required: false
    min: 1
    max: 100
    label:
      en_US: Results
    human_description:
      en_US: Most results to return, 1 to 100. Each 10 results cost $0.0015.
    llm_description: Most results to return.
    form: llm
  - name: time
    type: select
    required: false
    options:
      - value: pastWeek
        label:
          en_US: Past week
      - value: pastMonth
        label:
          en_US: Past month
      - value: pastYear
        label:
          en_US: Past year
    label:
      en_US: Time
    human_description:
      en_US: Only pages from this period. Leave empty for any time.
    llm_description: Only pages from this period. Leave out for any time.
    form: llm
  - name: include_domains
    type: string
    required: false
    label:
      en_US: Only these sites
    human_description:
      en_US: Comma-separated sites, such as reddit.com, github.com.
    llm_description: Comma-separated sites to search within, such as reddit.com.
    form: llm
extra:
  python:
    source: tools/web_search.py
