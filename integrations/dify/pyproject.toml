[project]
name = "stophy-dify-plugin"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["dify_plugin>=0.11.0,<0.12", "stophy>=1.2.1,<2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.uv.sources]
stophy = { path = "../../sdk/packages/python", editable = true }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
