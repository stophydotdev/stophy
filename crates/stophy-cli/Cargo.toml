[package]
name = "stophy-cli"
version = "2.3.0"
description = "Search, read, and act on the web from the command line"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "stophy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
getrandom = "0.4"
hostname = "0.4"
jiff = { version = "1", features = ["serde"] }
open = "5"
regex = "1"
reqwest.workspace = true
rpassword = "7"
semver = "1"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.11"
stophy = { path = "../stophy" }
stophy-mcp = { path = "../stophy-mcp" }
tempfile = "3"
tokio = { workspace = true, features = ["signal", "process"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[package.metadata.dist]
dist = true
