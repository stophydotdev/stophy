name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "python-v*"
    paths:
      - "packages/typescript/package.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - typescript
          - python
          - both

permissions:
  contents: read
  id-token: write

jobs:
  publish-typescript:
    name: npm
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.package == 'typescript' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Check published version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "stophy@${VERSION}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.exists == 'false'
        run: npm publish --access public

  publish-python:
    name: PyPI
    if: >-
      startsWith(github.ref, 'refs/tags/python-v') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.package == 'python' || inputs.package == 'both'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          PACKAGE_VERSION=$(uv version --project packages/python --short)
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match Python package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: uv build --project packages/python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
