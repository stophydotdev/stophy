name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check:ts

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build:ts

      - name: Verify generated client is up to date
        run: bun run generate:check

      - name: Test
        run: bun run test:ts

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --project packages/python --dev

      - name: Check formatting and lint
        run: uv run --project packages/python ruff check packages/python/src test/python && uv run --project packages/python ruff format --check packages/python/src test/python

      - name: Build
        run: uv build --project packages/python

      - name: Test
        run: uv --project packages/python run pytest
