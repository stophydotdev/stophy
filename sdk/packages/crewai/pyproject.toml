[project]
name = "crewai-stophy"
version = "0.1.0"
description = "Give your agents the live web. Stophy tools for CrewAI: search the web, read pages, and look up products, places, jobs and homes."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Stophy" }]
keywords = ["stophy", "crewai", "tools", "web-search", "scraping", "ai-agents"]
dependencies = ["crewai>=1.0.0,<2", "stophy>=1.2.1"]

[project.urls]
Homepage = "https://stophy.dev"
Repository = "https://github.com/stophydotdev/stophy"
Documentation = "https://github.com/stophydotdev/stophy/tree/main/sdk/packages/crewai"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "pyright>=1.1.400"]

[tool.uv.sources]
stophy = { path = "../python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_stophy"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
