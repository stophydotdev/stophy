[project]
name = "stophy"
version = "0.1.0"
description = "Official Python SDK for Stophy - YouTube context API for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Stophy" }]
keywords = ["stophy", "youtube", "transcript", "sdk", "ai-agents"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://stophy.dev"
Repository = "https://github.com/stophydotdev/sdk"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stophy"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["stophy"]

[tool.pytest.ini_options]
testpaths = ["../../test/python"]
