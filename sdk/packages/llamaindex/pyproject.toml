[project]
name = "llama-index-tools-stophy"
version = "0.1.0"
description = "Give your agents the live web. Stophy tools for LlamaIndex: search the web, read pages, and look up products, places, jobs and homes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stophy" }]
keywords = ["stophy", "llama-index", "llamaindex", "tools", "web-search", "scraping", "ai-agents"]
dependencies = ["llama-index-core>=0.13.0,<0.15", "stophy>=1.2.1"]

[project.urls]
Homepage = "https://stophy.dev"
Repository = "https://github.com/stophydotdev/stophy"
Documentation = "https://github.com/stophydotdev/stophy/tree/main/sdk/packages/llamaindex"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "pyright>=1.1.400"]

[tool.uv.sources]
stophy = { path = "../python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["llama_index"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
