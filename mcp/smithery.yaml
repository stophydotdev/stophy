startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: Optional. Your Stophy API key from stophy.dev/signup. Without it, only the free tools are available.
    required: []
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@stophy/mcp"],
      env: config.apiKey ? { STOPHY_API_KEY: config.apiKey } : {}
    })
