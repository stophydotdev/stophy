name: Publish to npm

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - '.github/workflows/publish.yml'
    branches:
      - main

permissions:
  id-token: write # npm trusted publishing + MCP registry OIDC login
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Check version and determine publish tag
        id: check-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if [[ "$VERSION" == *"beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

          if npm view ${PACKAGE_NAME}@${VERSION} version > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already exists on npm, skipping publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is new, will publish"
          fi

      # No NPM_TOKEN: npm exchanges the workflow's OIDC token (id-token: write)
      # for short-lived credentials via trusted publishing, and attaches
      # provenance automatically. The npm package must list this repo +
      # .github/workflows/publish.yml as a trusted publisher on npmjs.com.
      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        run: npm publish --access public --tag ${{ steps.check-version.outputs.tag }}

      - name: Check MCP Registry
        id: check-registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./server.json').name")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}&version=latest" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s).servers?.map(e=>e.server?.version)??[];process.exit(v.includes(process.argv[1])?0:1)})" "$VERSION"; then
            echo "registered=true" >> $GITHUB_OUTPUT
            echo "MCP Registry already has $VERSION"
          else
            echo "registered=false" >> $GITHUB_OUTPUT
            echo "MCP Registry does not have $VERSION yet"
          fi

      - name: Wait for npm to serve the version
        if: steps.check-registry.outputs.registered == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          for attempt in $(seq 1 30); do
            if npm view "${PACKAGE_NAME}@${VERSION}" version > /dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "npm does not serve ${PACKAGE_NAME}@${VERSION} after 5 minutes"
          exit 1

      - name: Install MCP Publisher
        if: steps.check-registry.outputs.registered == 'false'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Login to MCP Registry
        if: steps.check-registry.outputs.registered == 'false'
        run: ./mcp-publisher login github-oidc

      - name: Sync MCP Registry version
        if: steps.check-registry.outputs.registered == 'false'
        run: |
          node -e "
            const fs = require('fs');
            const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const manifest = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            manifest.version = packageJson.version;
            for (const pkg of manifest.packages ?? []) {
              if (pkg.registryType === 'npm' && pkg.identifier === '@stophy/mcp') {
                pkg.version = packageJson.version;
              }
            }
            fs.writeFileSync('server.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Publish to MCP Registry
        if: steps.check-registry.outputs.registered == 'false'
        run: ./mcp-publisher publish
